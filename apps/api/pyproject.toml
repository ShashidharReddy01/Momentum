[project]
name = "momentum"
version = "0.1.0"
description = "Momentum: AI-native work management"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "gunicorn>=22",
  "sqlalchemy[asyncio]>=2.0.30",
  "psycopg[binary,pool]>=3.2",
  "alembic>=1.13",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "structlog>=24.1",
  "typer>=0.12",
  "itsdangerous>=2.2",
  "uuid-utils>=0.9",
  "httpx>=0.27",
  "procrastinate>=2.14",
]

[project.scripts]
momentum = "momentum.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
  "import-linter>=2.0",
  "time-machine>=2.14",
  "hypothesis>=6.100",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["momentum"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF"]
ignore = ["S101", "B008", "RUF012", "UP046"]  # UP046: keep Generic[T] (pydantic-friendly)

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"migrations/**" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
packages = ["momentum"]

[[tool.mypy.overrides]]
module = ["procrastinate.*", "uuid_utils.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:procrastinate.*"]

[tool.importlinter]
root_package = "momentum"

[[tool.importlinter.contracts]]
name = "Core does not depend on outer layers"
type = "forbidden"
source_modules = ["momentum.core"]
forbidden_modules = ["momentum.domain", "momentum.ai", "momentum.agents", "momentum.integrations", "momentum.auth", "momentum.mcp", "momentum.web", "momentum.app"]

[[tool.importlinter.contracts]]
name = "Domain does not depend on AI, agents, integrations, or app wiring"
type = "forbidden"
source_modules = ["momentum.domain"]
forbidden_modules = ["momentum.agents", "momentum.integrations", "momentum.mcp", "momentum.app", "momentum.web"]
