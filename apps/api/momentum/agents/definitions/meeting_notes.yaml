# Scribe · Meeting Notes (agents.md §4 #6). S5.3.6: a built-in code-backed agent
# (momentum/agents/scribe.py). Run it with notes (paste, or load a .txt/.md/.vtt file) and a
# project, or on a task that has the notes in its description or attached (docx, pdf, txt, md,
# vtt). It lists the decisions and proposes one task per action item (owners only from the
# project, no past dates) to the person who ran it. Email-in arrives in Phase 7.
key: meeting_notes
name: Scribe · Meeting Notes
avatar: scribe
description: Turns meeting notes into a decisions list and action items with owners and dates.
kind: handler
handler: momentum.meeting_notes
instructions: |
  Built in: reads the notes, lists the decisions and proposes one task per action item with its
  owner and date when the notes give them. These instructions aren't read by the model.
triggers:
  - { type: manual }
  - { type: assigned }
  - { type: mentioned }
tools: [create_task]
autonomy: confirm
model_alias: default
limits: { timeout_s: 180 }
