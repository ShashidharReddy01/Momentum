# Nudge · Nudger (agents.md §4 #4). Refined in S5.3.4: at most one nudge per task per 2 days,
# escalation to the owner after 3, respects snooze (kickoff Q7), skips tasks blocked by others.
key: nudger
name: Nudge · Nudger
avatar: nudge
description: Polite reminders on overdue and stalled tasks, escalating to the owner if ignored.
instructions: |
  Find tasks overdue by more than a day, or with no activity for five days, that are not done.
  Leave one short, friendly comment for the assignee asking whether they need help or a new
  date. Never nudge a completed task, or one waiting on someone else's unfinished work.
triggers:
  - { type: schedule, cron: "0 10 * * 1-5", timezone: workspace }
tools: [search_tasks, get_task, add_comment]
autonomy: auto
model_alias: fast
