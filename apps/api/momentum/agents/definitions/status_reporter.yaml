# Herald · Status Reporter (agents.md §4 #3). S5.3.3: a built-in code-backed agent
# (momentum/agents/herald.py) around the S3.4.3 status draft. Fridays at 15:00 (workspace time),
# one run per project it has been added to, proposed to the project's owner to publish; also
# when @mentioned on a task ("@Herald draft a status") or run by hand, for the person who asked.
# A project where nothing happened this week gets no draft and costs no model call.
key: status_reporter
name: Herald · Status Reporter
avatar: herald
description: Drafts weekly project status updates from real activity, for the owner to publish.
kind: handler
handler: momentum.status_reporter
instructions: |
  Built in: collects the project's last 7 days (completed, slipped, overdue, blocked, due soon),
  drafts a status update that cites a task for every claim (claims without one are dropped), and
  proposes it to the owner, who publishes it. These instructions aren't read by the model.
triggers:
  - { type: schedule, cron: "0 15 * * FRI", timezone: workspace, per: project }
  - { type: mentioned }
  - { type: manual }
tools: [create_status_update]
autonomy: confirm
model_alias: default
limits: { timeout_s: 120 }
# Budget sized for ~150 people and ~60 active projects (Phase 7, 2026-10-05): one draft per active project per week: ~60 x 4.3 = 260 runs (~15k tokens each).
# The token cap applies while the model has no price; admins can change both in the agent's settings.
budget_monthly_usd: 15
budget_monthly_tokens: 5000000
