# Pulse · Daily Digest (agents.md §4 #1). S5.3.1: a built-in code-backed agent
# (momentum/agents/pulse.py). Runs once per person on weekdays at their own digest time (08:30
# in their timezone unless they set another), on their behalf: it only reports what they can
# already see. The lists come from code; the model writes one summary line. No digest (and no
# model call) when there's nothing to report or the person turned digests off.
key: daily_digest
name: Pulse · Daily Digest
avatar: pulse
description: A short morning digest of what's due, overdue, newly assigned and mentioned.
kind: handler
handler: momentum.daily_digest
instructions: |
  Built in: gathers the person's tasks due today and overdue, and the unread assignments,
  mentions and updates on followed tasks since their last digest, then writes one line on where
  to start. These instructions aren't read by the model.
triggers:
  - { type: schedule, cron: "30 8 * * 1-5", timezone: user, at: digest_time }
tools: []
autonomy: auto
model_alias: fast
limits: { timeout_s: 60 }
# Budget sized for ~150 people and ~60 active projects (Phase 7, 2026-10-05): one digest per person per weekday: ~150 people x 22 days = 3,300 runs (~3.5k tokens, ~$0.01 each).
# The token cap applies while the model has no price; admins can change both in the agent's settings.
budget_monthly_usd: 40
budget_monthly_tokens: 12000000
