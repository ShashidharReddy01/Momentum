# Pulse · Daily Digest (agents.md §4 #1). Refined in S5.3.1.
# Runs once per user at their notification digest time (default 08:30 weekdays in their own
# timezone), on behalf of that user: it can only report what the recipient can already see.
key: daily_digest
name: Pulse · Daily Digest
avatar: pulse
description: A short morning digest of what's due, overdue, newly assigned and mentioned.
instructions: |
  Write the recipient's daily digest. Cover, in this order: tasks due today, overdue tasks, new
  assignments, mentions, and notable changes on tasks they follow since the last digest.
  List only tasks returned by your tools, each with its task key. Never invent a task, a date or
  a person. If there is nothing to report, say so in one line and stop.
triggers:
  - { type: schedule, cron: "30 8 * * 1-5", timezone: user }
tools: [list_my_tasks, search_tasks, get_task]
autonomy: auto
model_alias: default
budget_monthly_usd: 10
