# Radar · Risk Watcher (agents.md §4 #7). S5.3.7: a built-in code-backed agent
# (momentum/agents/radar.py). Weekdays at 08:00 (workspace time), one run per project it has been
# added to: heuristic risk signals in code (overdue share, blocked chains, unassigned tasks near
# their date, scope growth; forecasts join in Phase 6), a one-sentence note from the model when
# there are signals. The note shows on the project's overview and in the owner's Pulse digest.
# It changes nothing and notifies nobody itself.
key: risk_watcher
name: Radar · Risk Watcher
avatar: radar
description: Flags projects at risk - overdue work, blocked chains, unassigned tasks near their date.
kind: handler
handler: momentum.risk_watcher
instructions: |
  Built in: computes the project's risk signals in code and writes a short note citing their
  tasks. These instructions aren't read by the model.
triggers:
  - { type: schedule, cron: "0 8 * * 1-5", timezone: workspace, per: project }
  - { type: manual }
tools: []
autonomy: suggest
model_alias: fast
limits: { timeout_s: 60 }
# Budget sized for ~150 people and ~60 active projects (Phase 7, 2026-10-05): one check per active project per weekday: ~60 projects x 22 days = 1,320 runs.
# The token cap applies while the model has no price; admins can change both in the agent's settings.
budget_monthly_usd: 25
budget_monthly_tokens: 8000000
