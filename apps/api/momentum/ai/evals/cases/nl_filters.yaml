# Phase 7.5 plain-English filters (spec §9.2; S75-10 builds the engine on the portfolio surface,
# S75-11 adds the list, board, calendar, My Tasks and search surfaces and grows this to 20+). The
# filters are compared exactly, as names (relative dates stay as said: the server resolves them in
# the person's timezone); unresolvable names are asked back with the real options.
feature: nl_filters
cases:
  - id: november_at_risk_implementations
    mock: true
    input: "Implementations going live in November that are at risk"
    expect:
      filters_exact: {stages: [Implementation], health: [at_risk], fields: [{field: "Target go-live", in_month: November}]}
      rows_max: 12
  - id: region_option
    mock: true
    input: "Customers in EMEA"
    expect: {filters_exact: {fields: [{field: Region, is_any: [EMEA]}]}}
  - id: owner_me
    mock: true
    input: "Projects I own"
    expect: {filters_exact: {owners: [me]}}
  - id: health_and_stages
    mock: true
    input: "Off track or at risk in Go-live or Hypercare"
    expect: {filters_exact: {health: [at_risk, off_track], stages: [Go-live, Hypercare]}}
  - id: currency_bound
    mock: true
    input: "Deals over 200k"
    expect: {filters_exact: {fields: [{field: "Contract value", on_or_after: "200000"}]}}
  - id: overdue_only
    mock: true
    input: "Customers with overdue work"
    expect: {filters_exact: {overdue_only: true}}
  - id: unknown_stage_asked_with_options
    mock: true
    input: "Anything in the Pilot stage"
    expect: {asks: true, options_include: [Discovery, Implementation]}
  - id: unknown_person_asked
    mock: true
    input: "Projects owned by Zed"
    expect: {asks: true, text_include_any: ["Zed"]}
  - id: off_topic_asked
    mock: true
    input: "What's the weather like?"
    expect: {asks: true}
  - id: relative_dates_and_multi_select
    mock: true
    input: "Analytics customers going live in the next 60 days"
    expect: {filters_exact: {fields: [{field: Products, is_any: [Analytics]}, {field: "Target go-live", on_or_after: today, on_or_before: "today+60"}]}}
  - id: empty_field
    mock: true
    input: "Customers with no target go-live yet"
    expect: {filters_exact: {fields: [{field: "Target go-live", has_value: false}]}}
  - id: name_contains
    mock: true
    input: "Projects named Harbor"
    expect: {filters_exact: {name_contains: Harbor}}
  - id: unknown_field_asked_with_options
    mock: true
    input: "Customers by vendor tier gold"
    expect: {asks: true, options_include: [Region, "Target go-live"]}
  # --- S75-11: the task surfaces (list / board / calendar of Launch Plan, My Tasks, search)
  - id: list_only_my_overdue_work
    mock: true
    surface: list
    input: "Only my overdue work"
    expect: {filters_exact: {people: [me], due: overdue}}
  - id: list_my_overdue_escalated
    mock: true
    surface: list
    input: "My overdue tasks tagged escalated"
    expect: {filters_exact: {people: [me], due: overdue, tags: [Escalated]}}
  - id: board_high_risk_unassigned
    mock: true
    surface: board
    input: "Unassigned work with high risk"
    expect: {filters_exact: {people: [Unassigned], fields: [{field: Risk, is_any: [High]}]}}
  - id: calendar_ana_this_week
    mock: true
    surface: calendar
    input: "What Ana has due this week"
    expect: {filters_exact: {people: ["Ana Souza"], due: this_week}}
  - id: list_including_done_sorted
    mock: true
    surface: list
    input: "Everything including done, sorted by due date, grouped by person"
    expect: {filters_exact: {show_completed: true, sort: due, group: assignee}}
  - id: list_unknown_tag_asked
    mock: true
    surface: list
    input: "Tasks tagged urgent-ish"
    expect: {asks: true, options_include: [Escalated, "Needs review"]}
  - id: list_words_asked_back
    mock: true
    surface: list
    input: "Anything that mentions DataCo"
    expect: {asks: true, text_include_any: ["Search"]}
  - id: my_tasks_vendor_field
    mock: true
    surface: my_tasks
    input: "My tasks where the vendor is DataCo, including finished ones"
    expect: {filters_exact: {show_completed: true, fields: [{field: Vendor, contains: DataCo}]}}
  - id: my_tasks_due_asked_back
    mock: true
    surface: my_tasks
    input: "Only my overdue ones"
    expect: {asks: true}
  - id: search_words_project_person
    mock: true
    surface: search
    input: "Search contract in Launch Plan assigned to Ana"
    expect: {filters_exact: {words: contract, project: "Launch Plan", people: ["Ana Souza"]}}
  - id: search_completed_comments
    mock: true
    surface: search
    input: "Finished tasks and comments about pricing"
    expect: {filters_exact: {words: pricing, completed: completed, types: [comment, task]}}
  - id: search_private_project_asked
    mock: true
    surface: search
    input: "Search ideas in Secret Roadmap"
    expect: {asks: true, no_leak: ["Zenith"]}
  # --- live-only
  - id: live_november_at_risk
    input: "Implementations going live in November that are at risk"
    expect: {filters_exact: {stages: [Implementation], health: [at_risk], fields: [{field: "Target go-live", in_month: November}]}}
  - id: live_red_customers
    input: "Which customers are in trouble?"
    expect: {filters_exact: {health: [off_track]}}
  - id: live_my_emea
    input: "My EMEA customers"
    expect: {filters_exact: {owners: [me], fields: [{field: Region, is_any: [EMEA]}]}}
  - id: live_big_deals_in_contracts
    input: "Contracts stage deals worth more than 250k"
    expect: {filters_exact: {stages: [Contracts], fields: [{field: "Contract value", on_or_after: "250000"}]}}
  - id: live_list_mine_overdue
    surface: list
    input: "Show me my late stuff"
    expect: {filters_exact: {people: [me], due: overdue}}
  - id: live_search
    surface: search
    input: "comments about the checkout"
    expect: {filters_exact: {words: checkout, types: [comment]}}
  - id: live_unknown_asks
    input: "Projects in the Pilot stage"
    expect: {asks: true}
