# Plan my day (S3.4.5): only the user's own open tasks, overdue first.
feature: plan_day
cases:
  - id: ravi_default
    mock: true
    expect: {citations_valid: true, proposes: [plan_my_day]}
  - id: ravi_overdue_first
    expect: {today_first_any: ["{{key:Finalize pricing tiers}}"], today_exclude: ["{{key:QA the checkout flow}}", "{{key:Kickoff meeting notes}}"]}
    judge: {rubric: "Puts the overdue pricing decision first and explains the order briefly with citations."}
  - id: ana_overdue_first
    user: ana
    expect: {today_include: ["{{key:Sign vendor contract}}"], today_exclude: ["{{key:Payment provider approval}}"]}
  - id: mei_blocked_later
    user: mei
    expect: {citations_valid: true}
    judge: {rubric: "Doesn't put the blocked pricing copy first; explains it waits on the pricing decision."}
  - id: no_private_leak
    user: ravi
    expect: {mentions_exclude: ["Zenith"], today_exclude: ["{{key:Secret launch partner: Zenith Corp}}"]}
  - id: priya_blocked_urgent
    user: priya
    expect: {citations_valid: true}
    judge: {rubric: "Doesn't present the blocked payment provider approval as ready to start; it says it waits on the vendor contract or leaves it out of today."}
  - id: ana_webinar_later
    user: ana
    expect: {today_exclude: ["{{key:Book launch webinar}}"], citations_valid: true}
  - id: mei_blocked_copy_not_today
    user: mei
    expect: {today_exclude: ["{{key:Update pricing page copy}}"], citations_valid: true}
  - id: ravi_reason_short
    expect: {citations_valid: true}
    judge: {rubric: "The explanation is brief (at most three sentences) and refers to tasks by their bracketed keys.", min: 3}
  - id: priya_own_private_task_ok
    user: priya
    expect: {citations_valid: true, min_citations: 1}
